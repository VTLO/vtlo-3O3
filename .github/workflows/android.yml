name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: vtlo-3o3-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
